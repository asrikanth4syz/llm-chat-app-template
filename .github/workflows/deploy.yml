name: Deploy

# Deploys the Worker to Cloudflare on every push to main (and on-demand via the
# Actions "Run workflow" button). Tests must pass first, so a red build never ships.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Backend tests
        run: npx vitest run

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # If you later want migrations applied automatically on deploy, add:
          #   command: d1 migrations apply smart-pantry-db --remote && deploy
          # (the app also self-heals its tables at runtime, so this is optional)
