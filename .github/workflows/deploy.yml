name: Deploy

# Deploys the Worker to Cloudflare on every push to main (and on-demand via the
# Actions "Run workflow" button). Tests must pass first, so a red build never ships.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Backend tests
        run: npx vitest run

      # Diagnostic: prove which Cloudflare account + permissions the CI token
      # actually resolves to, before attempting the deploy. The account *name*
      # and the token scope list are not secrets, so they print in the clear —
      # use them to confirm the token is in the SAME account as the Worker/D1
      # and carries "workers_scripts (write)" + "d1 (write)".
      - name: Verify Cloudflare auth (diagnostic)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"  || { echo "::error::CLOUDFLARE_API_TOKEN secret is empty"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is empty"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID secret length: ${#CLOUDFLARE_ACCOUNT_ID} (expected 32)"
          echo "--- wrangler whoami (token account + scopes) ---"
          npx wrangler whoami || echo "::warning::wrangler whoami failed — token is invalid or unauthorized"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploy only. Schema is NOT managed by wrangler migrations: this D1 was
          # bootstrapped at runtime and has no migration history, so
          # `d1 migrations apply` would replay 0001+ and collide. Instead the
          # Worker runs a version-gated bootstrap (runBootstrap / BOOTSTRAP_VERSION
          # in src/index.ts): the heavy schema+data self-heal executes once
          # globally, then becomes a cheap no-op. Bump BOOTSTRAP_VERSION when you
          # add feature tables. The warmup below triggers that bootstrap at deploy
          # time rather than on the first user request.

      # Kick one request so the version-gated bootstrap runs now (it executes in
      # waitUntil and writes app_meta.bootstrap_version). Non-fatal: a 401/anything
      # still triggers it, and the next real request would run it anyway.
      - name: Warm up (run one-time bootstrap)
        run: curl -fsS -m 30 https://smart-pantry.asrikanth.workers.dev/api/auth/me -o /dev/null || true
