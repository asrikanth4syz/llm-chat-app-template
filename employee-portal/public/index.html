<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4SYZ Employee Portal</title>
  <style>
    :root {
      --bg: #f4f6f8; --card: #ffffff; --ink: #1c2530; --muted: #5b6b7b;
      --line: #e2e8ef; --brand: #1f6feb; --brand-ink: #ffffff;
      --ok: #137333; --warn: #9a6700; --bad: #b42318; --mask: #334155;
      --radius: 12px; --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:#0f141a; --card:#171e26; --ink:#e7edf3; --muted:#9fb0c0;
        --line:#2a343f; --brand:#4f93ff; --mask:#c3cfdb;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Kannada", "Noto Sans Devanagari", sans-serif;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 48px; }
    header.bar {
      position: sticky; top: 0; z-index: 5; background: var(--card);
      border-bottom: 1px solid var(--line); margin-bottom: 16px;
    }
    .bar-in { max-width: 680px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
    .bar-in h1 { font-size: 16px; margin: 0; flex: 1; font-weight: 650; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin: 0 0 16px; }
    .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; font-weight: 650; }
    .row { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); }
    .row:first-of-type { border-top: 0; }
    .row .k { width: 40%; color: var(--muted); font-size: 13px; }
    .row .v { flex: 1; min-width: 0; word-break: break-word; }
    .mask { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mask); letter-spacing: .04em; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    input, select {
      width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
      background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    }
    input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: var(--brand); }
    button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 12px; }
    button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
    button.sm { padding: 5px 10px; font-size: 13px; }
    button:disabled { opacity: .5; cursor: default; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .lang { width: auto; padding: 6px 8px; font-size: 13px; }
    .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
    .pill.pending { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
    .pill.approved { color: var(--ok); }
    .pill.rejected { color: var(--bad); }
    .muted { color: var(--muted); }
    .msg { padding: 10px 12px; border-radius: 8px; margin: 0 0 14px; font-size: 14px; }
    .msg.ok { background: color-mix(in srgb, var(--ok) 12%, var(--card)); color: var(--ok); }
    .msg.err { background: color-mix(in srgb, var(--bad) 12%, var(--card)); color: var(--bad); }
    .center { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
    .login { width: 100%; max-width: 360px; }
    .stack > * + * { margin-top: 10px; }
    .grow { flex: 1; }
    @media (max-width: 460px) { .row { flex-direction: column; gap: 2px; } .row .k { width: auto; } }
  </style>
</head>
<body>
  <div id="app" class="wrap"></div>
  <script src="app.js?v=1"></script>
</body>
</html>
