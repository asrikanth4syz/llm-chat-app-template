<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4SYZ Employee Portal</title>
  <style>
    :root {
      --bg: #f1f5f9; --card: #ffffff; --ink: #0f172a; --muted: #64748b;
      --line: #e2e8f0; --brand: #4f46e5; --brand-ink: #ffffff; --brand-soft: #eef2ff;
      --ok: #16a34a; --warn: #b45309; --bad: #dc2626;
      --radius: 14px; --shadow: 0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.1);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1220; --card: #111a2b; --ink: #e2e8f0; --muted: #94a3b8;
        --line: #1e293b; --brand: #6366f1; --brand-soft: #1e213a;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b1220; --card: #111a2b; --ink: #e2e8f0; --muted: #94a3b8;
      --line: #1e293b; --brand: #6366f1; --brand-soft: #1e213a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Kannada", "Noto Sans Devanagari", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Shell: sidebar + main */
    .shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { background: var(--card); border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; font-weight: 700; font-size: 15px; }
    .brand .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; }
    .brand small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }
    .navitem { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; color: var(--muted); cursor: pointer; border: 0; background: none; width: 100%; text-align: left; font: inherit; }
    .navitem:hover { background: var(--bg); color: var(--ink); }
    .navitem.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
    .navitem svg { flex: none; }
    .spacer { flex: 1; }
    .side-foot { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }

    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--card) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 13px 20px; }
    .topbar h1 { font-size: 18px; margin: 0; flex: 1; font-weight: 650; }
    .content { padding: 20px; max-width: 880px; width: 100%; }
    .userchip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; overflow: hidden; flex: none; }
    img.avatar { object-fit: cover; }
    .avatar-lg { width: 60px; height: 60px; font-size: 22px; }

    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: sticky; top: 0; height: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; z-index: 6; }
      .brand, .spacer, .side-foot { display: none; }
      .navitem { flex-direction: column; gap: 4px; font-size: 11px; padding: 8px 12px; white-space: nowrap; }
      .content { padding: 16px; }
      .topbar h1 { font-size: 16px; }
    }

    /* Cards, rows */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin: 0 0 16px; }
    .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 12px; font-weight: 700; display: flex; align-items: center; }
    .row { display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
    .row:first-of-type { border-top: 0; }
    .row .k { width: 38%; color: var(--muted); font-size: 13px; }
    .row .v { flex: 1; min-width: 0; word-break: break-word; }
    .mask { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
    .muted { color: var(--muted); }
    .stack > * + * { margin-top: 10px; }
    .grow { flex: 1; }

    /* Stat tiles */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
    .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .stat .n { font-size: 22px; font-weight: 750; line-height: 1.1; }
    .stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* Form controls */
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    input, select { width: 100%; padding: 9px 12px; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 9px; }
    input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: var(--brand); }
    button { font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 13px; font-weight: 500; }
    button:hover { border-color: var(--muted); }
    button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
    button.primary:hover { filter: brightness(1.05); }
    button.sm { padding: 5px 11px; font-size: 13px; }
    button:disabled { opacity: .5; cursor: default; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .lang { width: auto; padding: 7px 9px; font-size: 13px; }

    /* Pills */
    .pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); font-weight: 500; }
    .pill.pending { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); background: color-mix(in srgb, var(--warn) 10%, transparent); }
    .pill.approved, .pill.active { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); background: color-mix(in srgb, var(--ok) 10%, transparent); }
    .pill.rejected, .pill.inactive { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); background: color-mix(in srgb, var(--bad) 10%, transparent); }

    /* Inline help: a small ? with a hover tooltip */
    .help { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); font-size: 11px; font-weight: 700; cursor: help; position: relative; margin-left: 7px; text-transform: none; }
    .help:hover, .help:focus { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
    .help:hover::after, .help:focus::after {
      content: attr(data-tip); position: absolute; left: 0; top: 150%; transform: translateX(-30%);
      background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 8px; font-size: 12px;
      font-weight: 400; line-height: 1.4; letter-spacing: normal; text-transform: none; width: 230px;
      z-index: 30; box-shadow: var(--shadow); white-space: normal;
    }

    /* Messages + login */
    .msg { padding: 10px 12px; border-radius: 9px; margin: 0 0 14px; font-size: 14px; }
    .msg.ok { background: color-mix(in srgb, var(--ok) 12%, var(--card)); color: var(--ok); }
    .msg.err { background: color-mix(in srgb, var(--bad) 12%, var(--card)); color: var(--bad); }
    .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .login { width: 100%; max-width: 380px; }
    .login .brand { justify-content: center; padding-bottom: 8px; }
    @media (max-width: 460px) { .row { flex-direction: column; gap: 2px; } .row .k { width: auto; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="app.js?v=3"></script>
</body>
</html>
